[package]
name = "izandhh15/shemanager"
version = "0.3.0"

[dependencies]
"php/php" = "=8.3.403"

[fs]
"/app/" = "."
"/config/" = "config/wasmer"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
env = ["PHPRC=/config/"]
