; config/wasmer/php.ini — ajustes PHP para Wasmer Edge
; Referencia: https://docs.wasmer.io/edge/guides/php/ (sección php.ini)

opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.max_file_size = 0

upload_max_filesize = "20M"
post_max_size = "25M"
memory_limit = "512M"
max_execution_time = 120
